<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Elements Example</title>
</head>
<body>
    <h1>Different Types of Input Elements</h1>

    <form action="#">
    
        <label for="text">Text Input:</label>
        <input type="text" id="text" name="text"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

    
        <label for="number">Number:</label>
        <input type="number" id="number" name="number" min="1" max="10"><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br><br>

        <label for="time">Time:</label>
        <input type="time" id="time" name="time"><br><br>

        
        <label for="color">Color:</label>
        <input type="color" id="color" name="color"><br><br>

        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0" max="100"><br><br>

        <label for="checkbox">Checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox"><br><br>

        <label for="radio">Radio Button:</label>
        <input type="radio" id="radio1" name="radio" value="Option 1">
        <label for="radio1">Option 1</label>
        <input type="radio" id="radio2" name="radio" value="Option 2">
        <label for="radio2">Option 2</label><br><br>

        <label for="file">File Upload:</label>
        <input type="file" id="file" name="file"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
