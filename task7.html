<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Default Values</title>
</head>
<body>

    <h2>Form with Default Values</h2>

    <form action="#">
        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="John Doe"><br><br>

        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="johndoe@example.com"><br><br>

    
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" value="123-456-7890"><br><br>

        
        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" checked> Male<br>
        <input type="radio" id="female" name="gender" value="female"> Female<br><br>

        
        <label for="subscribe">Subscribe to newsletter:</label>
        <input type="checkbox" id="subscribe" name="subscribe" checked><br><br>

        
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa" selected>United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
        </select><br><br>

        <!-- Textarea -->
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50">Hello, I would like to inquire about your services.</textarea><br><br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
