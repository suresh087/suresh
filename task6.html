<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Form</h2>
    <!-- Form that sends data to error-page.html -->
    <form action="error-page.html" method="GET">
        <label for="name">Full Name</label><br>
        <input type="text" id="name" name="name" required placeholder="Enter your full name"><br><br>

        <label for="phone">Phone Number</label><br>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number" pattern="[0-9]{10}"><br><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" required placeholder="Enter your email address"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
