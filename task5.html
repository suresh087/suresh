<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h2>Contact Us</h2>
    <form action="#" method="POST">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required placeholder="Enter your full name"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required placeholder="Enter your email address"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number"><br><br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" required placeholder="Enter the subject"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" required placeholder="Enter your message"></textarea><br><br>


        <fieldset>
            <legend>Employee Type:</legend>
            <label for="salaried">Salaried</label>
            <input type="radio" id="salaried" name="employeeType" value="salaried" required><br>
            
            <label for="ownBusiness">Own Business</label>
            <input type="radio" id="ownBusiness" name="employeeType" value="ownBusiness" required><br><br>
        </fieldset>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
